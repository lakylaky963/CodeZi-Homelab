name: Deploy Web App to Homelab

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-homelab
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    env:
      APP_DIR: /var/www/html
      PM2_NAME: codezi-backend
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v5

      - name: Copy Files to Web Directory
        run: |
          if [ ! -w "$APP_DIR" ]; then
            echo "$APP_DIR is not writable by $(whoami). It must be owned by the runner user."
            exit 1
          fi
          # server/.env lives only on the server: never delete it.
          rsync -a --delete \
            --exclude='.git/' --exclude='node_modules/' \
            --exclude='client/node_modules/' --exclude='client/dist/' \
            --exclude='server/.env' \
            ./ "$APP_DIR/"

      - name: Deploy Backend Updates
        working-directory: /var/www/html/server
        run: |
          npm ci --no-audit --no-fund
          if pm2 describe "$PM2_NAME" > /dev/null 2>&1; then
            pm2 restart "$PM2_NAME" --update-env
          else
            pm2 start src/server.js --name "$PM2_NAME"
          fi
          pm2 save
          sleep 5
          pm2 describe "$PM2_NAME" | grep -q 'status.*online' || { pm2 logs "$PM2_NAME" --lines 30 --nostream; exit 1; }

      - name: Deploy Frontend Updates
        working-directory: /var/www/html/client
        run: |
          rm -rf dist
          npm ci --no-audit --no-fund
          npm run build
