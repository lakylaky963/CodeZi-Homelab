name: Deploy Web App to Homelab

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-homelab
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    env:
      APP_DIR: /var/www/html
    steps:
      - uses: actions/checkout@v5

      - name: Sync code (keeps server/.env)
        run: |
          [ -w "$APP_DIR" ] || { echo "$APP_DIR must be owned by $(whoami)"; exit 1; }
          rsync -a --delete --exclude='.git/' --exclude='node_modules/' --exclude='client/dist/' \
            --exclude='server/.env' ./ "$APP_DIR/"
          [ -f "$APP_DIR/server/.env" ] || { echo "Missing $APP_DIR/server/.env (copy server/.env.example and fill it in)"; exit 1; }

      - name: Build and start containers
        working-directory: /var/www/html
        run: |
          docker compose up -d --build --remove-orphans
          docker image prune -f > /dev/null

      - name: Health check
        run: |
          for i in $(seq 1 20); do curl -fsS http://localhost/health > /dev/null && { echo healthy; exit 0; }; sleep 3; done
          docker compose -f /var/www/html/docker-compose.yml logs --tail 40
          exit 1
